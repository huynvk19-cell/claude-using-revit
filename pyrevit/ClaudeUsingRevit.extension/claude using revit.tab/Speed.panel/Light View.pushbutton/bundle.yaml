title: "Chế độ\nnhẹ"
tooltip: >-
  Làm view đang mở nhẹ hơn khi xoay / zoom / kéo, bấm lại để trả về đúng như cũ.
  Đổi trong view: Detail Level Coarse, Realistic thành Shading, tắt anti-aliasing,
  silhouettes, sketchy lines, depth cueing (chỉ khi view tự giữ các setting này; view theo
  View Template hoặc view của người khác thì chỉ báo, không đổi). Ẩn tạm (Temporary Hide,
  không lưu vào model): CAD import / link, Planting, Entourage, point cloud.
  Shift+click: ẩn tạm cả link Revit, hoặc trả về tất cả view đang nhẹ.
  View nằm trên sheet: tắt trước khi in / xuất PDF.
author: claude-using-revit
