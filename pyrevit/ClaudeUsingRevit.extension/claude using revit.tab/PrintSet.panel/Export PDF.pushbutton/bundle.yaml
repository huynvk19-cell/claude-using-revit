title: "Xuất\nPDF"
tooltip: >-
  Xuất PDF danh mục bản vẽ: mỗi sheet một file PDF riêng trong thư mục anh chọn (không gộp).
  Cửa sổ liệt kê các sheet của danh mục theo thứ tự schedule, tick chọn sheet cần xuất (mặc định
  chọn hết, hoặc các sheet đang chọn trong Revit), lọc theo số / tên, tuỳ chọn chia thư mục con
  theo một tham số của sheet (gợi ý theo Project Browser), bấm Xuất. Khổ giấy theo khung tên,
  zoom 100%, căn giữa, luôn vector. Sheet nặng được xuất từng phần rồi ghép lại thành một trang
  để Revit không văng; giữa các sheet giải phóng bộ nhớ và kiểm tra RAM, thiếu RAM thì dừng an
  toàn, bấm lại là xuất tiếp. Không bao giờ bỏ view: view từng làm Revit văng được xuất riêng hoặc chia ô vùng crop rồi ghép. Shift+click: xoá trí nhớ văng (sau khi sửa model).
author: claude-using-revit
