# Build the claude using revit add-in for every Revit version, compile every revit-commands/*.cs against that Revit's API,
# run the MCP server smoke test, build the installer ClaudeUsingRevit-Setup.exe, test it, and publish it to the release
# "setup-latest": https://github.com/<owner>/<repo>/releases/download/setup-latest/ClaudeUsingRevit-Setup.exe
name: claude using revit
permissions:
  contents: write      # publish the installer to the release "setup-latest"
on:
  push:
    paths: ["addin/**", "revit-commands/**", "skills/**", "agents/**", "domain/**", "workflows/**", "templates/**", "tools/**", ".github/workflows/claude-using-revit.yml"]
  pull_request:
    paths: ["addin/**", "revit-commands/**", "skills/**", "agents/**", "domain/**", "workflows/**", "templates/**", "tools/**", ".github/workflows/claude-using-revit.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the add-in (Revit 2023-2027)
        run: |
          for v in 2023 2024 2025 2026 2027; do
            dotnet build addin/src/ClaudeUsingRevit -c Release -p:RevitVersion=$v -nologo -v q
          done
          dotnet build addin/src/ClaudeUsingRevit.Compiler -c Release -nologo -v q

      - name: Commands compile (Revit 2023-2025)
        run: |
          for v in 2023 2024 2025; do
            dotnet run --project addin/tests/CommandCheck -c Release -- $v
          done

      - name: Commands on Revit 2026+ (ElementId.IntegerValue removed; report only)
        continue-on-error: true
        run: dotnet run --project addin/tests/CommandCheck -c Release -- 2026 | tail -1

      - name: MCP server smoke test
        run: bash addin/tests/smoke.sh

      - name: Build the installer (ClaudeUsingRevit-Setup.exe)
        run: SETUP_VERSION=$(date +%Y.%m.%d).${{ github.run_number }} bash addin/setup/make-setup.sh

      - name: Installer test (fake Windows folders)
        run: bash addin/tests/setup-test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsingRevit-Setup
          path: addin/dist/ClaudeUsingRevit-Setup.exe

      - name: Publish to the release "setup-latest" (a fixed download link)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: setup-latest
          name: "claude using revit - bản cài mới nhất"
          prerelease: true
          make_latest: false
          body: |
            Tải **ClaudeUsingRevit-Setup.exe**, bấm đúp, chọn bản Revit, bấm **Cài đặt**. Đóng Revit và Claude trước khi cài.
            Build từ ${{ github.ref_name }} @ ${{ github.sha }}.
          files: addin/dist/ClaudeUsingRevit-Setup.exe
