# Build the claude using revit add-in for every Revit version, compile every revit-commands/*.cs against that Revit's API,
# run the MCP server smoke test, and keep the built add-in as a download (Actions > this run > Artifacts > claude-using-revit-dist).
# Install a download without the .NET SDK: unzip it, then  install.ps1 -AddIn -Dist <unzipped folder>
name: claude using revit
on:
  push:
    paths: ["addin/**", "revit-commands/**", ".github/workflows/claude-using-revit.yml"]
  pull_request:
    paths: ["addin/**", "revit-commands/**", ".github/workflows/claude-using-revit.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the add-in (Revit 2023-2027)
        run: |
          for v in 2023 2024 2025 2026 2027; do
            dotnet build addin/src/ClaudeUsingRevit -c Release -p:RevitVersion=$v -nologo -v q
          done
          dotnet build addin/src/ClaudeUsingRevit.Compiler -c Release -nologo -v q

      - name: Commands compile (Revit 2023-2025)
        run: |
          for v in 2023 2024 2025; do
            dotnet run --project addin/tests/CommandCheck -c Release -- $v
          done

      - name: Commands on Revit 2026+ (ElementId.IntegerValue removed; report only)
        continue-on-error: true
        run: dotnet run --project addin/tests/CommandCheck -c Release -- 2026 | tail -1

      - name: MCP server smoke test
        run: bash addin/tests/smoke.sh

      - name: Lay out dist/<version>
        run: |
          for v in 2023 2024 2025 2026 2027; do
            tfm=net8.0; [ $v -lt 2025 ] && tfm=net48
            d=addin/dist/$v
            mkdir -p $d/roslyn
            (cd addin/src/ClaudeUsingRevit/bin/Release/$v && tar cf - --exclude='*.pdb' --exclude=compile-refs.txt --exclude=runtimes .) | (cd $d && tar xf -)
            cp addin/src/ClaudeUsingRevit.Compiler/bin/Release/$tfm/*.dll $d/roslyn/
          done

      - uses: actions/upload-artifact@v4
        with:
          name: claude-using-revit-dist
          path: addin/dist
