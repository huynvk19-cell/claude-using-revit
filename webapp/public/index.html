<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Revit">
  <meta name="theme-color" content="#03040a">
  <title>claude using revit</title>
  <link rel="icon" href="/icon/Print Set Sync.png">
  <link rel="apple-touch-icon" href="/icon/Print Set Sync.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="space" aria-hidden="true"></canvas>

  <!-- top ornament: the Revit window, its model and view -->
  <header class="ornament top">
    <div id="where" class="where"><span class="dot"></span><b id="o-model">Đang kết nối…</b><span id="o-view" class="dim"></span></div>
    <span id="o-todo" class="todo-pill hidden"></span>
    <span id="busy" class="busy hidden"></span>
    <button class="icon-btn" id="btn-board" title="Kiểm tra lại"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg></button>
    <button class="icon-btn" id="btn-access" title="Mở trên iPad / máy khác"><svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg></button>
  </header>

  <!-- side ornament: the three places -->
  <nav class="ornament side" id="nav">
    <button data-view="tools" class="on" title="Công cụ"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span>Công cụ</span></button>
    <button data-view="all" title="Tất cả lệnh"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Lệnh</span></button>
    <button data-view="jobs" title="Nhật ký"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Nhật ký</span></button>
  </nav>

  <main>
    <div id="windows" class="window-picker hidden"></div>
    <div id="notice" class="notice hidden"></div>
    <div id="view-tools" class="tiles"></div>
    <div id="view-all" class="all hidden">
      <div class="glass list-pane">
        <input id="search" type="search" placeholder="Tìm lệnh" autocomplete="off">
        <div id="filters" class="seg"></div>
        <div id="cmd-list" class="cmd-list"></div>
      </div>
      <div class="glass detail-pane" id="cmd-detail"><p class="dim">Chọn một lệnh.</p></div>
    </div>
    <div id="view-jobs" class="glass jobs hidden"></div>
  </main>

  <!-- a tool opened as its own window -->
  <div id="stage" class="stage hidden">
    <div class="win-wrap">
      <section id="win" class="glass window"></section>
      <div class="window-bar"><button class="close" id="win-close" title="Đóng"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button><span class="grabber"></span></div>
    </div>
  </div>

  <div id="modal" class="stage hidden"><div class="glass sheet" id="modal-body"></div></div>
  <div id="toasts" class="toasts"></div>

  <div id="login" class="stage hidden">
    <form class="glass sheet login" id="login-form">
      <h2>Mã truy cập</h2>
      <p class="dim">Mã nằm trong %APPDATA%\claude-using-revit\webapp.json (khoá "token").</p>
      <input id="login-code" autocomplete="one-time-code" placeholder="mã" required>
      <button class="pill primary" type="submit">Vào</button>
    </form>
  </div>

  <script src="space.js"></script>
  <script src="app.js"></script>
</body>
</html>
